<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfb668"/>
      <stop offset="50%" stop-color="#c8963e"/>
      <stop offset="100%" stop-color="#9a6f22"/>
    </linearGradient>
    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14958b"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(10, 8)">
    <!-- Outer Shield / Crest -->
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#teal-grad)" filter="url(#glow)"/>
    <!-- Gold Monogram Crown / Lotus Wave -->
    <path d="M 32 14 L 38 24 L 48 20 L 42 34 L 50 46 L 32 40 L 14 46 L 22 34 L 16 20 L 26 24 Z" fill="url(#gold-grad)"/>
    <circle cx="32" cy="27" r="4" fill="#ffffff"/>
  </g>

  <!-- Typography -->
  <text x="85" y="38" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="700" fill="url(#teal-grad)" letter-spacing="0.5">SERENDIB GRAND</text>
  <text x="86" y="56" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#c8963e" letter-spacing="3">RESORT &amp; SPA &bull; BENTOTA</text>
</svg>
